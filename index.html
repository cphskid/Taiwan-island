<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>穿越吧！島嶼開拓者・即將開幕</title>
<style>
  :root{--cream:#fff4dc;--wood:#6b3f1f;--wood-2:#8a5429;--gold:#ffc23d;--ink:#3a2412;--sky:#bfe6f5}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--sky);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;padding:16px}
  .panel{max-width:440px;text-align:center;background:var(--cream);border:6px solid var(--wood-2);border-radius:24px;box-shadow:inset 0 0 0 3px var(--gold),0 8px 20px rgba(0,0,0,.25);padding:24px}
  img.tick{width:130px;height:130px;object-fit:contain}
  h1{margin:8px 0;font-size:24px}
  p{font-size:18px;line-height:1.6}
  a{display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 20px;border-radius:26px;border:3px solid var(--gold);background:linear-gradient(#7fd85a,#4aa834);color:#fff;font-weight:700;font-size:18px;text-decoration:none}
  a img{width:36px;height:36px}
</style>
</head>
<body>
  <div class="panel">
    <img class="tick" src="img/tick.webp" alt="">
    <h1>穿越吧！島嶼開拓者</h1>
    <p>島嶼開拓者還在施工中，第一章「八堡圳」快要完成了，請先回樂園玩其他設施！</p>
    <a href="/"><img src="img/park.webp" alt="">回樂園</a>
  </div>
</body>
</html>
