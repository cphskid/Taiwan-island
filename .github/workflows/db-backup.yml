# 每天自動備份正式資料庫（Supabase 免費方案沒有自動備份）。
#
# 每天台灣時間凌晨 3:00 跑一次，也可以在 Actions 頁手動按「Run workflow」。
# 用 pg_dump 匯出 public（遊戲資料）、auth（帳號）、storage（檔案清單）三個 schema，
# 再用密碼加密後存成這次執行的附件，保留 30 天。
# 這個 repo 是公開的，所以一定要加密；沒有 BACKUP_PASSPHRASE 就不會產出檔案。
#
# 需要的 repo secrets（Settings → Secrets and variables → Actions）：
#   SUPABASE_DB_URL     正式庫連線字串：Supabase 後台 Connect → Session pooler 那一串
#                       postgresql://postgres.xxxx:密碼@aws-0-xxx.pooler.supabase.com:5432/postgres
#   BACKUP_PASSPHRASE   自己訂的一組長密碼，還原時要用，請另外記好
#
# 還原（在自己電腦）：
#   gpg --decrypt prod-YYYYMMDD.dump.gpg > prod.dump
#   pg_restore --no-owner --no-privileges -d "<目標庫連線字串>" prod.dump
name: db-backup

on:
  schedule:
    - cron: "0 19 * * *" # UTC 19:00 = 台灣 03:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 檢查 secrets
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then
            echo "::error::還沒設定 SUPABASE_DB_URL 或 BACKUP_PASSPHRASE，備份沒有執行"
            exit 1
          fi

      - name: 匯出資料庫
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p out
          # 用 Postgres 17 的 pg_dump（新版可以匯出 15/17 的資料庫）
          docker run --rm -v "$PWD/out:/out" -e DB_URL postgres:17 \
            pg_dump "$DB_URL" -Fc --no-owner --no-privileges \
              -n public -n auth -n storage \
              -f /out/prod.dump
          ls -l out/prod.dump
          # 太小代表大概沒匯到東西
          test "$(stat -c %s out/prod.dump)" -gt 100000

      - name: 加密
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          name="prod-$(TZ=Asia/Taipei date +%Y%m%d-%H%M).dump.gpg"
          echo "$PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "out/$name" out/prod.dump
          rm out/prod.dump
          echo "NAME=$name" >> "$GITHUB_ENV"
          ls -l out

      - name: 存成附件（保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: out/${{ env.NAME }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
